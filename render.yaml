services:
  - type: keyvalue
    name: offdock-kv
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
  - type: web
    name: offdock-orchestrator
    runtime: python
    plan: free
    healthCheckPath: /healthz
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn orchestrator.main:app --host 0.0.0.0 --port $PORT --ws-ping-interval 20 --ws-ping-timeout 20
    envVars:
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: offdock-kv
          property: connectionString
      - key: MESH_MASTER_SECRET
        generateValue: true
      - key: ADMIN_DASHBOARD_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: PLANNER_MODEL
        value: gemini-2.5-flash
      - key: CONTAINERIZER_MODEL
        value: gemini-2.5-flash
      - key: RECOVERY_MODEL
        value: gemini-2.5-flash
      - key: DOCKERHUB_USERNAME
        sync: false
      - key: DOCKERHUB_TOKEN
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: E2B_API_KEY
        sync: false
